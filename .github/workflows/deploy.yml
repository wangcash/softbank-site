name: 部署到 Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 只上传网站文件，README、deploy.sh 等不对外发布
      - name: 整理网站文件
        run: |
          mkdir dist
          cp -r index.html icons logo dist/

      # main 分支发布到正式环境，其他分支生成预览地址
      - name: 用 wrangler 部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=softbank-site --branch="$GITHUB_REF_NAME" --commit-dirty=true
