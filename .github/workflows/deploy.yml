name: 部署到 Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # 只上传网站文件，README、deploy.sh 等不对外发布
      - name: 整理网站文件
        run: |
          mkdir dist
          cp -r index.html icons logo dist/

      # main 分支发布到正式环境，其他分支生成预览地址
      - name: 用 wrangler 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=softbank-site --branch=${{ github.ref_name }} --commit-dirty=true
