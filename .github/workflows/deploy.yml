name: 部署到 Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 只上传网站文件，README、deploy.sh 等不对外发布
      - name: 整理网站文件
        run: |
          mkdir dist
          cp -r index.html icons logo dist/

      # softbank-site 是只含静态资源的 Worker，自定义域名在 Cloudflare 控制台里绑定
      - name: 用 wrangler 部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name softbank-site --assets dist --compatibility-date 2026-09-23
