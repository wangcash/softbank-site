<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="开源软库" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 「库」字的广字头：一点、一横、一撇，像一个遮风挡雨的屋檐 -->
  <circle cx="35" cy="7.5" r="4" fill="#1281FF"/>
  <rect x="10" y="14.5" width="48" height="6" rx="3" fill="#1281FF"/>
  <path d="M17.5 18 C17.5 37 14 49 7 58" fill="none" stroke="#1281FF" stroke-width="6" stroke-linecap="round"/>
  <!-- 屋檐下的四个软件方块，右上角的青色方块代表 AI -->
  <rect x="26" y="28" width="14" height="14" rx="3.5" fill="#1281FF"/>
  <rect x="43" y="28" width="14" height="14" rx="3.5" fill="#00C2A8"/>
  <rect x="26" y="45" width="14" height="14" rx="3.5" fill="#1281FF"/>
  <rect x="43" y="45" width="14" height="14" rx="3.5" fill="#1281FF" fill-opacity=".45"/>
</svg>
